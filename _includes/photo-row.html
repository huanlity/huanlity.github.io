<div class="photo-row">
{%- assign folder = "/asset/" | append: include.category | append: "_thumb/" -%}
{%- assign photos = site.static_files | where_exp: "f", "f.path contains folder" | sort: "name" -%}
{%- for photo in photos -%}
  <a href="{{ include.href }}">
    <img src="/asset/{{ include.category }}_thumb/{{ photo.basename }}.jpg" loading="lazy" alt="">
  </a>
{%- endfor -%}
</div>
