<style>
.photo-grid {
  column-count: 3;
  column-gap: 10px;
}
.photo-grid a {
  display: block;
  margin-bottom: 10px;
  break-inside: avoid;
}
.photo-grid img {
  width: 100%;
  display: block;
  border-radius: 4px;
}
@media (max-width: 800px) {
  .photo-grid { column-count: 2; }
}
@media (max-width: 500px) {
  .photo-grid { column-count: 1; }
}
</style>

<div class="photo-grid">
{%- assign folder = "/asset/" | append: include.category | append: "/" -%}
{%- assign photos = site.static_files | where_exp: "f", "f.path contains folder" | sort: "name" -%}
{%- for photo in photos -%}
  <a href="/asset/{{ include.category }}_full/{{ photo.basename }}.jpg" target="_blank">
    <img src="/asset/{{ include.category }}_thumb/{{ photo.basename }}.jpg" loading="lazy" alt="">
  </a>
{%- endfor -%}
</div>
