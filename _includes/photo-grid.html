<style>
.photo-grid {
  column-count: 3;
  column-gap: 10px;
}
.photo-grid a {
  display: block;
  margin-bottom: 10px;
  break-inside: avoid;
}
.photo-grid img {
  width: 100%;
  display: block;
  border-radius: 4px;
}
@media (max-width: 800px) {
  .photo-grid { column-count: 2; }
}
@media (max-width: 500px) {
  .photo-grid { column-count: 1; }
}

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.lightbox.open {
  display: flex;
}
.lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  object-fit: contain;
}
.lightbox button {
  position: absolute;
  background: none;
  border: none;
  color: #fff;
  font-size: 2.5rem;
  line-height: 1;
  cursor: pointer;
  padding: 0.5rem 1rem;
}
.lightbox-close {
  top: 10px;
  right: 20px;
  font-size: 2rem;
}
.lightbox-prev {
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
}
.lightbox-next {
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
}
</style>

<div class="photo-grid" id="photo-grid-{{ include.category }}">
{%- assign folder = "/asset/" | append: include.category | append: "_thumb/" -%}
{%- assign photos = site.static_files | where_exp: "f", "f.path contains folder" | sort: "name" -%}
{%- for photo in photos -%}
  <a href="/asset/{{ include.category }}_full/{{ photo.basename }}.jpg" target="_blank">
    <img src="/asset/{{ include.category }}_thumb/{{ photo.basename }}.jpg" loading="lazy" alt="">
  </a>
{%- endfor -%}
</div>

<div class="lightbox" id="lightbox-{{ include.category }}">
  <button class="lightbox-close" aria-label="Close">&times;</button>
  <button class="lightbox-prev" aria-label="Previous">&#10094;</button>
  <img src="" alt="">
  <button class="lightbox-next" aria-label="Next">&#10095;</button>
</div>

<script>
(function () {
  var grid = document.getElementById('photo-grid-{{ include.category }}');
  var lightbox = document.getElementById('lightbox-{{ include.category }}');
  var lightboxImg = lightbox.querySelector('img');
  var links = Array.prototype.slice.call(grid.querySelectorAll('a'));
  var current = -1;

  function show(i) {
    current = (i + links.length) % links.length;
    lightboxImg.src = links[current].getAttribute('href');
    lightbox.classList.add('open');
  }
  function close() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
    current = -1;
  }

  links.forEach(function (link, i) {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      show(i);
    });
  });

  lightbox.querySelector('.lightbox-close').addEventListener('click', close);
  lightbox.querySelector('.lightbox-prev').addEventListener('click', function () { show(current - 1); });
  lightbox.querySelector('.lightbox-next').addEventListener('click', function () { show(current + 1); });
  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) close();
  });
  document.addEventListener('keydown', function (e) {
    if (current === -1) return;
    if (e.key === 'ArrowLeft') show(current - 1);
    else if (e.key === 'ArrowRight') show(current + 1);
    else if (e.key === 'Escape') close();
  });
})();
</script>
