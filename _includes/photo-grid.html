<style>
.photo-grid {
  column-count: 3;
  column-gap: 10px;
}
.photo-grid a {
  display: block;
  margin-bottom: 10px;
  break-inside: avoid;
}
.photo-grid img {
  width: 100%;
  display: block;
  border-radius: 4px;
}
@media (max-width: 800px) {
  .photo-grid { column-count: 2; }
}
@media (max-width: 500px) {
  .photo-grid { column-count: 1; }
}
</style>

<div class="photo-grid">
{%- assign photos = site.static_files | where_exp: "f", "f.path contains include.folder" | sort: "name" -%}
{%- for photo in photos -%}
  <a href="{{ photo.path | relative_url }}" target="_blank">
    <img src="{{ photo.path | relative_url }}" loading="lazy" alt="">
  </a>
{%- endfor -%}
</div>
